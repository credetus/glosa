name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      final: ${{ steps.channel.outputs.final }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # vX.Y.Z -> PyPI + GitHub Release; any other tag (e.g. v0.1.0rc1) -> TestPyPI
      - name: Determine release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
            echo "Final release: publishing to PyPI"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
            echo "Pre-release: publishing to TestPyPI"
          fi

      - name: Verify tag matches project version
        run: |
          PKG_VERSION="$(uv version --short)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - run: uv build
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "from glosa import BaseStorageManager, Glosa"
      - name: Smoke test sdist
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "from glosa import BaseStorageManager, Glosa"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.final != 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/glosa/
    permissions:
      id-token: write # TestPyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glosa/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
